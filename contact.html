<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Newsreader:ital,wght@0,400;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">


<div class="wrap">

  <a href="index.html" class="back-link">&larr; Home</a>

  <header class="card-header">
    <p class="eyebrow">Get in touch</p>
    <h1 class="name">Contact</h1>
    <p class="tagline">I enjoy a good letter. Consider this an open invitation.</p>
  </header>

  <section>
    <div class="section-head">
      <span class="call-number">384.3</span>
      <h2 class="section-title">Send a message</h2>
    </div>
    <p class="section-note">Fields marked are required.</p>

    <form id="contact-form" action="https://formspree.io/f/mnpawejr" method="POST">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="What's on your mind?" required></textarea>
      </div>

      <!-- Honeypot field: hidden from real visitors, catches simple bots -->
      <input type="text" name="_gotcha" class="honeypot" tabindex="-1" autocomplete="off">

      <button type="submit">Send message</button>
    </form>

    <div id="status" class="status-message"></div>
  </section>

  <footer>
    <p class="colophon">Powered by Formspree</p>
  </footer>

</div>

<script>
  const form = document.getElementById('contact-form');
  const status = document.getElementById('status');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const data = new FormData(form);

    try {
      const response = await fetch(form.action, {
        method: 'POST',
        body: data,
        headers: { 'Accept': 'application/json' }
      });

      if (response.ok) {
        status.textContent = "Thanks— your message has been sent.";
        status.className = 'status-message success';
        form.reset();
        form.style.display = 'none';
      } else {
        status.textContent = "Something went wrong. Please try again.";
        status.className = 'status-message error';
      }
    } catch (error) {
      status.textContent = "Something went wrong. Please try again.";
      status.className = 'status-message error';
    }
  });
</script>

</body>
</html>
