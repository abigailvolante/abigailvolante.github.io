<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Newsreader:ital,wght@0,400;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:     #F6F5F1;
    --ink:       #22252B;
    --ink-dim:   #6B6E76;
    --accent:    #5B6B8C;
    --line:      #DEDCD4;

    --display: 'Fraunces', serif;
    --body: 'Newsreader', serif;
    --mono: 'IBM Plex Mono', monospace;

    --max-w: 720px;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-size: 18px;
    line-height: 1.65;
  }

  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; }
  a:hover { border-bottom-color: var(--accent); }
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }
  ::selection { background: var(--accent); color: var(--paper); }

  .wrap{ max-width: var(--max-w); margin: 0 auto; padding: 0 28px; }

  .back-link{
    display: inline-block;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.05em;
    color: var(--ink-dim);
    margin-top: 40px;
  }

  .back-link:hover{ color: var(--accent); }

  header.card-header{ padding: 24px 0 56px; }

  .eyebrow{
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 20px;
  }

  h1.name{
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(2.2rem, 5.5vw, 3.2rem);
    line-height: 1.08;
    margin: 0 0 18px;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  .tagline{
    font-family: var(--body);
    font-style: italic;
    font-size: 1.1rem;
    color: var(--ink-dim);
    max-width: 50ch;
    margin: 0 0 40px;
  }

  section{ padding: 60px 0; }

  .section-head{
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 8px;
  }

  .call-number{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.03em;
    white-space: nowrap;
  }

  h2.section-title{
    font-family: var(--display);
    font-weight: 600;
    font-size: 1.5rem;
    margin: 0;
    color: var(--ink);
  }

  .section-note{
    font-family: var(--body);
    font-style: italic;
    color: var(--ink-dim);
    font-size: 0.95rem;
    margin: 0 0 34px;
  }

  /* ---------- Form ---------- */

  form{ max-width: 480px; }

  .field{ margin-bottom: 28px; }

  label{
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-bottom: 10px;
  }

  input[type="text"],
  input[type="email"],
  textarea{
    width: 100%;
    padding: 10px 0;
    border: none;
    border-bottom: 1px solid var(--line);
    background: transparent;
    font-family: var(--body);
    font-size: 1rem;
    color: var(--ink);
    transition: border-color 0.15s ease;
  }

  textarea{
    resize: vertical;
    min-height: 110px;
    line-height: 1.6;
  }

  input[type="text"]:focus,
  input[type="email"]:focus,
  textarea:focus{
    border-color: var(--accent);
  }

  input::placeholder,
  textarea::placeholder{
    color: var(--ink-dim);
    opacity: 0.6;
    font-style: italic;
  }

  .honeypot{
    position: absolute;
    left: -9999px;
    opacity: 0;
    pointer-events: none;
  }

  button{
    margin-top: 8px;
    padding: 12px 30px;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
    border-radius: 2px;
    font-family: var(--mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  button:hover{
    background: var(--ink);
    color: var(--paper);
  }

  .status-message{
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    font-family: var(--body);
    font-style: italic;
    font-size: 1rem;
    display: none;
  }

  .status-message.success{ display: block; color: var(--ink); }
  .status-message.error{ display: block; color: #a24141; }

  footer{ padding: 0 0 90px; }

  .colophon{
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-dim);
    opacity: 0.7;
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>

<div class="wrap">

  <a href="index.html" class="back-link">&larr; Home</a>

  <header class="card-header">
    <p class="eyebrow">Get in touch</p>
    <h1 class="name">Contact</h1>
    <p class="tagline">I enjoy a good letter. Consider this an open invitation.</p>
  </header>

  <section>
    <div class="section-head">
      <span class="call-number">01</span>
      <h2 class="section-title">Send a message</h2>
    </div>
    <p class="section-note">Fields marked are required.</p>

    <form id="contact-form" action="https://formspree.io/f/mnpawejr" method="POST">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="What's on your mind?" required></textarea>
      </div>

      <!-- Honeypot field: hidden from real visitors, catches simple bots -->
      <input type="text" name="_gotcha" class="honeypot" tabindex="-1" autocomplete="off">

      <button type="submit">Send message</button>
    </form>

    <div id="status" class="status-message"></div>
  </section>

  <footer>
    <p class="colophon">Powered by Formspree</p>
  </footer>

</div>

<script>
  const form = document.getElementById('contact-form');
  const status = document.getElementById('status');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const data = new FormData(form);

    try {
      const response = await fetch(form.action, {
        method: 'POST',
        body: data,
        headers: { 'Accept': 'application/json' }
      });

      if (response.ok) {
        status.textContent = "Thanks — your message has been sent.";
        status.className = 'status-message success';
        form.reset();
        form.style.display = 'none';
      } else {
        status.textContent = "Something went wrong. Please try again.";
        status.className = 'status-message error';
      }
    } catch (error) {
      status.textContent = "Something went wrong. Please try again.";
      status.className = 'status-message error';
    }
  });
</script>

</body>
</html>
